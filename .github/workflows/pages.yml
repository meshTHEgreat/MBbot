name: Deploy report portal

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "reports/**"
      - "live.html"
      - "assets/live-trades.css"
      - "assets/live-trades-model.js"
      - "assets/live-trades.js"
      - "v2/data/**"
      - "v2/reports/**"
      - "wide-net-master-2026-08-02/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out report site
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enforce static-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          approved_wide_net_csv="./wide-net-master-2026-08-02/exploratory-wide-net-discriminant-2026-08-01-codex-5kkgue/*.csv"
          prohibited="$(find . -type f \( \
            -name '.env' -o \
            -name '*.dbn' -o \
            -name '*.dbn.zst' -o \
            -name '*.csv' -o \
            -name '*.toml' -o \
            -name '*.py' -o \
            -name '*.pem' \
          \) ! -path "$approved_wide_net_csv" -print -quit)"
          if [[ -n "$prohibited" ]]; then
            echo "Static Pages artifact contains prohibited local/data file: $prohibited" >&2
            exit 1
          fi
          test "$(find ./wide-net-master-2026-08-02/exploratory-wide-net-discriminant-2026-08-01-codex-5kkgue -maxdepth 1 -type f -name '*.csv' | wc -l)" -eq 18

      - name: Upload report site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
