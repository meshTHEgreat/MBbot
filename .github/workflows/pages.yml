name: Deploy report portal

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out report site
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enforce static-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          prohibited="$(find . -type f \( \
            -name '.env' -o \
            -name '*.dbn' -o \
            -name '*.dbn.zst' -o \
            -name '*.csv' -o \
            -name '*.toml' -o \
            -name '*.py' -o \
            -name '*.pem' \
          \) -print -quit)"
          if [[ -n "$prohibited" ]]; then
            echo "Static Pages artifact contains prohibited local/data file: $prohibited" >&2
            exit 1
          fi

      - name: Upload report site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
